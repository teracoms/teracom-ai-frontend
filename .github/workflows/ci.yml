name: CI

# Website_Application_Separation_Plan_V1.md §4.4 / §5 Phase 2 (pipeline
# introduced) / Phase 4 (updated for the post-split repo). Originally
# written when this repo still served both the marketing website and the
# Teracom AI product; the marketing site has since moved out to
# teracom-solutions-website, which carries its own copy of this pipeline
# built against its own routes (/, /robots.txt, /sitemap.xml). This copy
# now targets only the routes that remain here.
#
# Every step below is self-contained: no GitHub repo secrets, no real
# backend, no database. `next build` uses lib/config.js's own fallback
# BACKEND_API_URL when unset (no page fetches it at build time — every
# /portal and /customer-portal route renders dynamically, per-request,
# not at build time), and the deployment-validation smoke test below
# deliberately only exercises routes that render with no backend call at
# all (the login pages) — this pipeline must be able to prove the app
# builds and boots on its own, without requiring teracom-ai-backend to
# be running anywhere.
#
# UI_DECOUPLING_PLAN_V1.md (2026-08-22): this repo now owns its own
# app/globals.css outright — the former @teracoms/ui local `file:`
# dependency (and the sibling-repo checkout it required) is gone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ci:
    name: Lint, test, build, and deployment validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout teracom-ai-frontend
        uses: actions/checkout@v4
        with:
          path: teracom-ai-frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'teracom-ai-frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'teracom-ai-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: teracom-ai-frontend
        run: npm ci

      - name: Lint
        working-directory: teracom-ai-frontend
        run: npm run lint

      - name: Test
        working-directory: teracom-ai-frontend
        run: npm test

      - name: Build
        working-directory: teracom-ai-frontend
        run: npm run build

      # Deployment validation — not a real deploy (Phase 5's job, once a
      # real target exists per Website_Application_Separation_Plan_V1.md
      # §4.8). This starts the actual production build the same way
      # `npm start` would on the real host, and proves it comes up and
      # serves real traffic before anything is allowed to merge to main.
      - name: Start production server
        working-directory: teracom-ai-frontend
        run: |
          npm start &
          disown

      - name: Wait for server to become ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://127.0.0.1:3000/portal/login"; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not become ready within 30s"
          exit 1

      - name: Smoke-test backend-independent routes
        run: |
          set -e
          for path in "/portal/login" "/customer-portal/login"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000${path}")
            echo "GET ${path} -> ${code}"
            if [ "${code}" != "200" ]; then
              echo "::error::${path} returned ${code}, expected 200"
              exit 1
            fi
          done

      # `npm start` spawns `next start` as a child process — the PID `$!`
      # captures is npm's own wrapper, not the actual server, so this
      # kills by matching the real process instead of a tracked PID.
      # Harmless either way in CI (each job runs in a throwaway VM that's
      # destroyed after this job), but correct is still better than
      # accidentally-correct.
      - name: Stop production server
        if: always()
        run: pkill -f "next-server" || true
