# Teracom AI — reverse proxy / TLS termination config ("Package SEC1").
#
# NOT DEPLOYED. This file is a real, ready-to-use nginx server config —
# not enabled anywhere today. See ../REVERSE_PROXY_AND_TLS.md for why
# (no root access, no public domain/DNS on this host) and for the exact
# steps to deploy this once both are available.
#
# Fronts ONLY the frontend (127.0.0.1:3000). The backend
# (127.0.0.1:8000) is never proxied publicly and has no reason to be —
# the only consumer of the backend is the frontend's own Next.js
# server, calling it directly over loopback (ADR-002's BFF pattern).
# Exposing the backend through this proxy as well would defeat the
# purpose of that pattern.
#
# Replace REPLACE_WITH_REAL_DOMAIN everywhere before using.

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_REAL_DOMAIN;

    # Required for certbot's HTTP-01 challenge (webroot method).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: redirect to HTTPS. Never proxy plaintext traffic.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name REPLACE_WITH_REAL_DOMAIN;

    # Populated by certbot (see REVERSE_PROXY_AND_TLS.md §2).
    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_REAL_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_REAL_DOMAIN/privkey.pem;

    # Mozilla "intermediate" baseline (https://ssl-config.mozilla.org/) —
    # broad browser compatibility without permitting deprecated protocols.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TeracomSSL:10m;
    ssl_session_tickets off;

    # HSTS — only add once you are certain every subdomain in scope is
    # served over HTTPS; it's very hard to walk back for the max-age
    # duration once a browser has cached it.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Real client IP through to the app (Next.js/uvicorn otherwise see
    # nginx's own loopback address for every request).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Next.js dev-mode HMR uses a WebSocket; harmless to keep these
        # in production too, and required if `next dev` is ever used
        # here again for debugging.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
